<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Information</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="card">
      <h2 class="title">My Personal Information</h2>
      <div class="underline"></div>

      <img src="photo.jpg" alt="Profile Image" class="profile-img" />

      <table class="info-table">
        <tr>
          <td class="label-cell"><i class="fa-solid fa-user"></i> Name</td>
          <td class="value-cell">Yasmine Alaa</td>
        </tr>
        <tr>
          <td class="label-cell">
            <i class="fa-solid fa-calendar-days"></i> Age
          </td>
          <td class="value-cell">20</td>
        </tr>
        <tr>
          <td class="label-cell">
            <i class="fa-solid fa-graduation-cap"></i> Faculty
          </td>
          <td class="value-cell">Computers and Informatics</td>
        </tr>
        <tr>
          <td class="label-cell"><i class="fa-solid fa-star"></i> Hobby</td>
          <td class="value-cell">Coding</td>
        </tr>
      </table>
    </div>
  </body>
</html>
